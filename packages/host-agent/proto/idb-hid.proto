// Minimal subset of facebook/idb's idb.proto — just enough to call the `hid`
// RPC on idb_companion (touch / swipe / key injection). Kept separate from
// idb-video.proto so each RPC's surface stays small.
//
// Field numbers and message shapes match the descriptor compiled into the
// installed idb client (idb.grpc.idb_pb2) so the wire format is what
// idb_companion expects. Note HIDSwipe skips 3/4: delta = 5, duration = 6.

syntax = "proto3";

package idb;

message Point {
  double x = 1;
  double y = 2;
}

message HIDEvent {
  enum HIDDirection {
    DOWN = 0;
    UP = 1;
  }
  enum HIDButtonType {
    APPLE_PAY = 0;
    HOME = 1;
    LOCK = 2;
    SIDE_BUTTON = 3;
    SIRI = 4;
  }
  message HIDTouch {
    Point point = 1;
  }
  message HIDButton {
    HIDButtonType button = 1;
  }
  message HIDKey {
    uint64 keycode = 1;
  }
  message HIDPressAction {
    oneof action {
      HIDTouch touch = 1;
      HIDButton button = 2;
      HIDKey key = 3;
    }
  }
  message HIDPress {
    HIDPressAction action = 1;
    HIDDirection direction = 2;
  }
  message HIDSwipe {
    Point start = 1;
    Point end = 2;
    double delta = 5;     // 0 → companion default step
    double duration = 6;  // 0 → companion default duration
  }
  message HIDDelay {
    double duration = 1;
  }
  oneof event {
    HIDPress press = 1;
    HIDSwipe swipe = 2;
    HIDDelay delay = 3;
  }
}

message HIDResponse {}

service CompanionService {
  rpc hid(stream HIDEvent) returns (HIDResponse) {}
}
